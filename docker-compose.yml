# Usage:  put documents in ./data/docs, then  docker compose up --build
# Chat UI: http://localhost:8501   API docs: http://localhost:8000/docs
services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  # One-off job: download the model into the shared volume, then exit
  ollama-pull:
    image: ollama/ollama
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull llama3.2:3b"]
    restart: "no"

  api:
    build: .
    environment:
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./data/docs:/app/data/docs:ro
      - ./index:/app/index
    ports:
      - "8000:8000"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501",
              "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    environment:
      - RAG_API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  ollama:
